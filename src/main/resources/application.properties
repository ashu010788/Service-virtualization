spring.application.name=service-virtualization-platform

# ── Outbound Forwarding Proxy (disabled by default) ──────────────────────
# Point to your real upstream service URL. For manual testing, start the
# Python mock upstream on port 9999 (see README). In JUnit tests, WireMock
# overrides this via @DynamicPropertySource with a random port.
proxy.upstream.base-url=http://localhost:9999
proxy.upstream.record-on-miss=true
# Change to true for manual upstream/WireMock testing — tests are now self-contained:
#   OutboundForwardingTest → @DynamicPropertySource pins true + WireMock random port
#   ForwardingProxyTest    → @TestPropertySource pins false, always expects 404 on miss

kafka.embedded.enabled=false
kafka.embedded.input-topics=payments,orders
kafka.embedded.output-topic-suffix=-completed
kafka.embedded.consumer-group=svp-virtual-consumer
