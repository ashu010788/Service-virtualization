<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: common}">
    <title>Traffic | SVP</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: sidebar}"></div>

<div class="main-content">
    <div class="page-header d-flex justify-content-between align-items-start">
        <div>
            <h1>Traffic Viewer</h1>
            <p>Real-time traffic log with auto-refresh</p>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <span class="badge bg-secondary" th:text="'Total logged: ' + ${totalLogged}">Total: 0</span>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="autoRefreshToggle" checked
                       onchange="toggleAutoRefresh()"/>
                <label class="form-check-label text-svp-muted" for="autoRefreshToggle"
                       style="font-size: 0.8125rem;">Auto-refresh</label>
            </div>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="card mb-3">
        <div class="card-body py-2">
            <form class="row g-2 align-items-end" id="trafficSearchForm">
                <div class="col-md-2">
                    <label class="form-label">Protocol</label>
                    <select class="form-select form-select-sm" id="searchProtocol">
                        <option value="">All</option>
                        <option>HTTP</option>
                        <option>GRPC</option>
                        <option>KAFKA</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Method/Topic</label>
                    <input type="text" class="form-control form-control-sm" id="searchMethod"
                           placeholder="GET, POST, payment-events..."/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Path</label>
                    <input type="text" class="form-control form-control-sm" id="searchPath"
                           placeholder="Filter by path..."/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status Code</label>
                    <input type="number" class="form-control form-control-sm" id="searchStatus"
                           placeholder="e.g. 200"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Stub ID</label>
                    <input type="text" class="form-control form-control-sm" id="searchStubId"
                           placeholder="Filter by stub..."/>
                </div>
                <div class="col-md-1">
                    <label class="form-label">Limit</label>
                    <input type="number" class="form-control form-control-sm" id="searchLimit"
                           value="50" min="1" max="500"/>
                </div>
                <div class="col-md-1">
                    <button type="button" class="btn btn-primary btn-sm w-100" onclick="searchTraffic()">
                        <i class="bi bi-search me-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Traffic Table -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>
                <i class="bi bi-activity me-2"></i>Recent Traffic
                <span id="refreshIndicator" style="display:none;" class="ms-2">
                    <div class="spinner-border spinner-border-sm text-accent" role="status"></div>
                </span>
            </span>
            <button class="btn btn-sm btn-outline-danger" onclick="clearTraffic()">
                <i class="bi bi-trash me-1"></i>Clear
            </button>
        </div>
        <div class="card-body p-0">
            <div id="trafficTableContainer">
                <table class="table table-hover mb-0" th:if="${not #lists.isEmpty(recentTraffic)}">
                    <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Session</th>
                        <th>Protocol</th>
                        <th>Method/Topic</th>
                        <th>Path</th>
                        <th>Stub ID</th>
                        <th>Status</th>
                        <th>Latency</th>
                        <th>Rules</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="entry : ${recentTraffic}">
                        <td class="text-svp-muted" style="white-space: nowrap;"
                            th:data-ts="${entry.timestamp()}">
                            <script th:inline="javascript">
                                document.currentScript.parentElement.textContent =
                                    new Date(/*[[${entry.timestamp()}]]*/).toLocaleTimeString('en-US', {hour12:false, fractionalSecondDigits:3});
                            </script>
                        </td>
                        <td>
                            <code class="text-svp-muted" th:text="${entry.sessionId() != null ? entry.sessionId() : '--'}">--</code>
                        </td>
                        <td>
                            <span class="badge badge-protocol"
                                  th:classappend="${entry.protocol() != null and entry.protocol().toUpperCase() == 'HTTP' ? 'badge-http' : (entry.protocol() != null and entry.protocol().toUpperCase() == 'GRPC' ? 'badge-grpc' : 'badge-kafka')}"
                                  th:text="${entry.protocol() != null ? entry.protocol() : 'HTTP'}">HTTP</span>
                        </td>
                        <td>
                            <span class="badge bg-secondary" th:text="${entry.method()}">GET</span>
                        </td>
                        <td>
                            <code th:text="${entry.path()}">/api/test</code>
                        </td>
                        <td>
                            <code class="text-accent" th:text="${entry.matchedStubId() != null ? entry.matchedStubId() : '--'}">--</code>
                        </td>
                        <td>
                            <span th:class="${entry.statusCode() &lt; 400 ? 'text-svp-green' : (entry.statusCode() &lt; 500 ? 'text-svp-yellow' : 'text-svp-red')}"
                                  th:text="${entry.statusCode()}">200</span>
                        </td>
                        <td class="text-svp-muted"
                            th:text="${#numbers.formatDecimal(entry.executionLatencyMs(), 1, 2) + 'ms'}">0.00ms</td>
                        <td>
                            <span th:if="${entry.matchedRules() != null}" class="text-svp-muted"
                                  th:text="${#lists.size(entry.matchedRules())}" style="font-size: 0.75rem;">0</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div th:if="${#lists.isEmpty(recentTraffic)}" class="text-center py-5 text-svp-muted">
                    <i class="bi bi-inbox" style="font-size: 2.5rem;"></i>
                    <p class="mt-2 mb-0">No traffic recorded yet</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var autoRefreshInterval = null;
    var autoRefreshEnabled = true;

    function startAutoRefresh() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(function() {
            // Bug fixed here: this used to always call refreshTraffic(), which hits
            // /api/v1/traffic/recent and ignores every filter field. The result: you'd click
            // Search, see a filtered table for ~3 seconds, then watch it silently snap back to
            // the unfiltered "recent" list on the next auto-refresh tick — looking exactly like
            // "search doesn't filter". Auto-refresh now re-runs whatever is currently in the
            // filter fields instead of a separate, filter-blind code path.
            if (autoRefreshEnabled) searchTraffic();
        }, 3000);
    }

    function toggleAutoRefresh() {
        autoRefreshEnabled = document.getElementById('autoRefreshToggle').checked;
        if (autoRefreshEnabled) {
            startAutoRefresh();
        } else if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
        }
    }

    function searchTraffic() {
        var params = new URLSearchParams();
        var protocol = document.getElementById('searchProtocol').value;
        var path = document.getElementById('searchPath').value;
        var method = document.getElementById('searchMethod').value;
        var status = document.getElementById('searchStatus').value;
        var stubId = document.getElementById('searchStubId').value;
        var limit = document.getElementById('searchLimit').value || 50;

        if (protocol) params.set('protocol', protocol);
        if (path) params.set('path', path);
        if (method) params.set('method', method);
        if (status) params.set('statusCode', status);
        if (stubId) params.set('stubId', stubId);
        params.set('limit', limit);

        var url = (protocol || path || method || status || stubId)
            ? '/api/v1/traffic/search?' + params.toString()
            : '/api/v1/traffic/recent?limit=' + limit;

        fetch(url)
            .then(function(r) { return r.json(); })
            .then(function(entries) { renderTrafficTable(entries); });
    }

    function renderTrafficTable(entries) {
        var container = document.getElementById('trafficTableContainer');
        if (!entries || entries.length === 0) {
            container.innerHTML = '<div class="text-center py-5 text-svp-muted">' +
                '<i class="bi bi-inbox" style="font-size: 2.5rem;"></i>' +
                '<p class="mt-2 mb-0">No traffic recorded yet</p></div>';
            return;
        }

        var html = '<table class="table table-hover mb-0"><thead><tr>' +
            '<th>Timestamp</th><th>Session</th><th>Protocol</th><th>Method/Topic</th>' +
            '<th>Path</th><th>Stub ID</th><th>Status</th><th>Latency</th><th>Rules</th>' +
            '</tr></thead><tbody>';

        entries.forEach(function(e) {
            var ts = new Date(e.timestamp).toLocaleTimeString('en-US', {hour12: false, fractionalSecondDigits: 3});
            var statusClass = e.statusCode < 400 ? 'text-svp-green' : (e.statusCode < 500 ? 'text-svp-yellow' : 'text-svp-red');
            var proto = (e.protocol || 'HTTP').toUpperCase();
            var protoBadge = proto === 'HTTP' ? 'badge-http' : (proto === 'GRPC' ? 'badge-grpc' : 'badge-kafka');

            html += '<tr>' +
                '<td class="text-svp-muted" style="white-space:nowrap;">' + ts + '</td>' +
                '<td><code class="text-svp-muted">' + (e.sessionId || '--') + '</code></td>' +
                '<td><span class="badge badge-protocol ' + protoBadge + '">' + proto + '</span></td>' +
                '<td><span class="badge bg-secondary">' + e.method + '</span></td>' +
                '<td><code>' + e.path + '</code></td>' +
                '<td><code class="text-accent">' + (e.matchedStubId || '--') + '</code></td>' +
                '<td><span class="' + statusClass + '">' + e.statusCode + '</span></td>' +
                '<td class="text-svp-muted">' + e.executionLatencyMs.toFixed(2) + 'ms</td>' +
                '<td><span class="text-svp-muted" style="font-size:0.75rem;">' + (e.matchedRules ? e.matchedRules.length : 0) + '</span></td>' +
                '</tr>';
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function clearTraffic() {
        if (!confirm('Clear all traffic logs?')) return;
        fetch('/api/v1/traffic', { method: 'DELETE' })
            .then(function() { searchTraffic(); });
    }

    startAutoRefresh();
</script>
</body>
</html>
