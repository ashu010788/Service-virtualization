<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="common">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        :root {
            --svp-bg: #0d1117;
            --svp-sidebar: #161b22;
            --svp-card: #1c2128;
            --svp-border: #30363d;
            --svp-text: #e6edf3;
            --svp-muted: #8b949e;
            --svp-accent: #58a6ff;
            --svp-green: #3fb950;
            --svp-red: #f85149;
            --svp-yellow: #d29922;
            --svp-purple: #bc8cff;
        }

        body {
            background-color: var(--svp-bg);
            color: var(--svp-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background-color: var(--svp-sidebar);
            border-right: 1px solid var(--svp-border);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 1000;
            overflow-y: auto;
        }

        .sidebar .brand {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--svp-border);
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--svp-text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar .brand i {
            font-size: 1.25rem;
            color: var(--svp-accent);
        }

        .sidebar .nav-link {
            color: var(--svp-muted);
            padding: 0.625rem 1rem;
            font-size: 0.875rem;
            border-radius: 6px;
            margin: 2px 8px;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            transition: all 0.15s ease;
        }

        .sidebar .nav-link:hover {
            color: var(--svp-text);
            background-color: rgba(88, 166, 255, 0.1);
        }

        .sidebar .nav-link.active {
            color: var(--svp-text);
            background-color: rgba(88, 166, 255, 0.15);
        }

        .sidebar .nav-link i {
            font-size: 1rem;
            width: 1.25rem;
            text-align: center;
        }

        .main-content {
            margin-left: 240px;
            padding: 1.5rem 2rem;
            min-height: 100vh;
        }

        .card {
            background-color: var(--svp-card);
            border: 1px solid var(--svp-border);
            border-radius: 8px;
        }

        .card-header {
            background-color: transparent;
            border-bottom: 1px solid var(--svp-border);
            font-weight: 600;
            font-size: 0.875rem;
        }

        .table {
            color: var(--svp-text);
            --bs-table-bg: transparent;
            --bs-table-hover-bg: rgba(88, 166, 255, 0.05);
            --bs-table-striped-bg: rgba(255, 255, 255, 0.02);
            font-size: 0.875rem;
        }

        .table th {
            border-bottom-color: var(--svp-border);
            color: var(--svp-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .table td {
            border-bottom-color: var(--svp-border);
            vertical-align: middle;
        }

        .badge-protocol {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.25em 0.5em;
            border-radius: 4px;
        }

        .badge-http { background-color: rgba(88, 166, 255, 0.2); color: var(--svp-accent); }
        .badge-grpc { background-color: rgba(188, 140, 255, 0.2); color: var(--svp-purple); }
        .badge-kafka { background-color: rgba(210, 153, 34, 0.2); color: var(--svp-yellow); }

        .stat-card {
            padding: 1.25rem;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            color: var(--svp-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        .form-control, .form-select {
            background-color: var(--svp-bg);
            border-color: var(--svp-border);
            color: var(--svp-text);
            font-size: 0.875rem;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--svp-bg);
            border-color: var(--svp-accent);
            color: var(--svp-text);
            box-shadow: 0 0 0 0.2rem rgba(88, 166, 255, 0.25);
        }

        .form-control:disabled, .form-select:disabled {
            background-color: var(--svp-muted);
            border-color: var(--svp-border);
            color: #000000;
            opacity: 1;
        }

        .form-control:disabled::placeholder {
            color: #000000;
            opacity: 1;
        }

        .form-label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--svp-muted);
        }

        .form-range::-webkit-slider-thumb {
            background-color: var(--svp-accent);
        }

        .modal-content {
            background-color: var(--svp-card);
            border: 1px solid var(--svp-border);
            color: var(--svp-text);
        }

        .modal-header { border-bottom-color: var(--svp-border); }
        .modal-footer { border-top-color: var(--svp-border); }

        pre {
            background-color: var(--svp-bg);
            border: 1px solid var(--svp-border);
            border-radius: 6px;
            padding: 1rem;
            color: var(--svp-text);
            font-size: 0.8125rem;
            max-height: 400px;
            overflow: auto;
        }

        .page-header {
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .page-header p {
            color: var(--svp-muted);
            font-size: 0.875rem;
            margin-bottom: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.active { background-color: var(--svp-green); }
        .status-dot.disabled { background-color: var(--svp-red); }

        .text-accent { color: var(--svp-accent) !important; }
        .text-svp-green { color: var(--svp-green) !important; }
        .text-svp-red { color: var(--svp-red) !important; }
        .text-svp-yellow { color: var(--svp-yellow) !important; }
        .text-svp-muted { color: var(--svp-muted) !important; }

        .nav-section-label {
            padding: 0.75rem 1rem 0.25rem;
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--svp-muted);
        }
    </style>
</head>
<body></body>
</html>
